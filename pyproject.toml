[project]
name = "sdr-os"
version = "0.2.0"
description = "SDR OS - Robotics simulation and control platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "genesis-forge>=0.3.0",
    "genesis-world>=0.3.13",
    "nats-py>=2.9.0",
    "torch>=2.8.0",
]

[dependency-groups]
dev = []
cuda = [
    "av>=14.0.0",
    "PyOpenGL-accelerate>=3.1.10",
    "PyTurboJPEG>=1.7.0",
]
rocm = [
    "av>=14.0.0",
    "PyOpenGL-accelerate>=3.1.10",
    "PyTurboJPEG>=1.7.0",
]
mlx = [
    "mlx",
]
mlx_cpu = [
    "mlx[cpu]",
]
mlx_cuda12 = [
    "mlx[cuda12]",
]
mlx_cuda13 = [
    "mlx[cuda13]",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mike",
    "pymdown-extensions",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
