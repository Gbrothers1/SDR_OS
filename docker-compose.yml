# SDR_OS Multi-Service Docker Compose
# Profiles: dev, sim, train, obs, tools, cuda, rocm, mlx
#
# Quick start:
#   docker compose --profile sim up          # Sim + transport + ROS
#   docker compose --profile cuda up         # CUDA CI target
#   docker compose --profile obs up          # Observability stack

networks:
  edge:
    driver: bridge
  backplane:
    driver: bridge
    internal: true
  train:
    driver: bridge

volumes:
  sdr_ipc:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m
  nats_data:
  taichi_cache:
  prometheus_data:
  grafana_data:

services:
  # ──────────────── EDGE ────────────────

  webserver:
    image: caddy:2-alpine
    profiles: ["sim", "dev"]
    networks: [edge, backplane]
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./configs/tls:/etc/caddy/tls:ro
      - ./dist:/srv/www:ro
    depends_on:
      node:
        condition: service_healthy
      ros-bridge:
        condition: service_started
      transport-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  node:
    profiles: ["sim", "dev"]
    build:
      context: .
      dockerfile: containers/node/Dockerfile
    image: sdr_os-node
    networks: [backplane]
    expose:
      - "3000"
    volumes:
      - ./rl/checkpoints:/policy-library/workspace:ro
      - ${SDR_EXTRA_POLICY_CHECKPOINTS:-./rl/checkpoints}:/policy-library/extra:ro
      # Writable lab data (policy tags) — the policy roots above are read-only.
      - ./artifacts/lab:/lab-data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - TRANSPORT_HOST=transport-server
      - TRANSPORT_PORT=8080
      - SDR_POLICY_ROOTS=workspace=/policy-library/workspace,${SDR_EXTRA_POLICY_LABEL:-extra}=/policy-library/extra
      - SDR_LAB_DATA=/lab-data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ──────────────── SIMULATION ────────────────

  genesis-sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: containers/cuda/Dockerfile
    image: sdr_os-cuda
    network_mode: host  # TEMP: dev mode — revert to [backplane] before release
    volumes:
      - .:/workspace
      - ${SDR_EXTRA_POLICY_CHECKPOINTS:-./rl/checkpoints}:/policy-library/extra:ro
      # Eval status (run_registry.jsonl) for the extra root's checkout. Safe
      # existing-file default so the mount never breaks when the var is unset;
      # _run_registry_paths skips files that aren't real registries.
      - ${SDR_EXTRA_POLICY_REGISTRY:-./package.json}:/policy-library/extra-registry.jsonl:ro
      - sdr_ipc:/dev/shm/sdr_os_ipc
      - taichi_cache:/root/.cache/taichi
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video
      - SDR_GPU_ID=${SDR_GPU_ID:-1}
      - PYGLET_HEADLESS=true
      - SDR_NATS_URL=nats://localhost:4222
      - SDR_POLICY_ROOTS=workspace=/workspace/rl/checkpoints,${SDR_EXTRA_POLICY_LABEL:-extra}=/policy-library/extra
      - SDR_RUN_REGISTRY=/workspace/artifacts/run_registry.jsonl:/policy-library/extra-registry.jsonl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cpuset: "2,3,4"
    shm_size: "2gb"
    command: ["python3", "scripts/genesis_sim_runner.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      nats:
        condition: service_healthy

  # ──────────────── TRANSPORT ────────────────

  transport-server:
    profiles: ["sim", "dev"]
    build:
      context: services/transport-server
      dockerfile: Dockerfile
    image: sdr_os-transport
    networks: [edge, backplane]
    ports:
      - "8080:8080"  # TEMP: dev mode — WebSocket stream endpoint
    volumes:
      - sdr_ipc:/dev/shm/sdr_os_ipc:ro
    environment:
      - SDR_SHM_PATH=/dev/shm/sdr_os_ipc/frames
      - SDR_NATS_URL=nats://nats:4222
      - SDR_TELEMETRY_MAX_SIZE=1048576
      - RUST_LOG=info
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ──────────────── ROS2 ────────────────

  ros-bridge:
    profiles: ["sim", "dev"]
    build:
      context: .
      dockerfile: containers/ros-jazzy/Dockerfile
    image: sdr_os-ros-jazzy
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      - ROS_ENABLE_ROSBRIDGE=1
      - ROS_NODE_COMMANDS=python3 /workspace/scripts/ros/sim_state_republisher.py; python3 /workspace/scripts/ros/cmd_vel_to_nats_bridge.py
      - ROS_DOMAIN_ID=0
    command: ["/workspace/scripts/ros/run_nodes.sh"]
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/jazzy/setup.bash && ros2 topic list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────── MESSAGING ────────────────

  nats:
    image: nats:2-alpine
    profiles: ["sim", "dev", "train"]
    container_name: sdr_os_training-nats
    networks: [backplane, train]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats_data:/data
      - ./configs/nats.conf:/etc/nats/nats.conf:ro
    command: ["-c", "/etc/nats/nats.conf"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ──────────────── TRAINING ────────────────

  training-runner:
    profiles: ["train"]
    build:
      context: .
      dockerfile: containers/cuda/Dockerfile
    image: sdr_os_cuda_train
    container_name: sdr_os_training-runner
    networks: [train]
    volumes:
      - .:/workspace
    environment:
      # Default: isolate training to GPU 0 (set SDR_TRAIN_GPU_ID to override).
      - NVIDIA_VISIBLE_DEVICES=${SDR_TRAIN_GPU_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - SDR_GPU_ID=${SDR_TRAIN_GPU_ID:-0}
      - TRAIN_NUM_ENVS=${TRAIN_NUM_ENVS:-8192}
      - TRAIN_CUDA_DEVICE=${TRAIN_CUDA_DEVICE:-0}
      - TRAIN_EXP_NAME=${TRAIN_EXP_NAME:-go2-jump-power}
      - NATS_URL=nats://nats:4222
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    shm_size: "2gb"
    depends_on:
      nats:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        cd /workspace &&
        python3 -c "import importlib.util, subprocess, sys; sys.exit(0) if importlib.util.find_spec('rsl_rl') else sys.exit(subprocess.call([sys.executable,'-m','pip','install','git+https://github.com/leggedrobotics/rsl_rl.git']))" &&
        stdbuf -oL -eL python3 rl/scripts/train_go2_jump.py
        --cuda_device ${TRAIN_CUDA_DEVICE:-0}
        --num_envs ${TRAIN_NUM_ENVS:-8192}
        --exp_name ${TRAIN_EXP_NAME:-go2-jump-power}
        | tee -a rl/checkpoints/${TRAIN_EXP_NAME:-go2-jump-power}_train.log

  tensorboard:
    profiles: ["train", "tools"]
    build:
      context: .
      dockerfile: containers/cuda/Dockerfile
    image: sdr_os_cuda_train
    container_name: sdr_os_training-tensorboard
    networks: [train]
    ports:
      - "6006:6006"
    volumes:
      - .:/workspace:ro
    command:
      - python3
      - -m
      - tensorboard.main
      - --logdir
      - /workspace/rl/checkpoints
      - --host
      - 0.0.0.0
      - --port
      - "6006"

  # ──────────────── OBSERVABILITY ────────────────

  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    networks: [backplane]
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    networks: [backplane]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ──────────────── CI TARGETS ────────────────
  # These are the original CI-focused containers for lint/test/build.

  app-cuda:
    profiles: ["cuda"]
    build:
      context: .
      dockerfile: containers/cuda/Dockerfile
    image: sdr_os-cuda
    volumes:
      - .:/workspace
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"

  app-rocm:
    profiles: ["rocm"]
    build:
      context: .
      dockerfile: containers/rocm/Dockerfile
    image: sdr_os-rocm
    volumes:
      - .:/workspace
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    shm_size: "2gb"

  app-mlx:
    profiles: ["mlx"]
    build:
      context: .
      dockerfile: containers/mlx/Dockerfile
      args:
        MLX_VARIANT: mlx_cpu
    image: sdr_os-mlx
    volumes:
      - .:/workspace
    shm_size: "2gb"
